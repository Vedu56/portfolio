<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT PAGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        h1 {
            font-family: 'Audiowide', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        nav {
            margin-bottom: 2rem;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #ffffff;
        }
        a:hover {
            background-color: #ffffff;
            color: #000000;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        input, textarea {
            width: 100%;
            padding: 0.8rem;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
        }
        input:focus, textarea:focus {
            background-color: #111111;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }
        button {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: 'Audiowide', sans-serif;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:hover:not(:disabled) {
            background-color: #ffffff;
            color: #000000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Status Banner */
        #status-box {
            display: none;
            border: 1px solid #ffffff;
            padding: 1.5rem;
            margin-top: 1.5rem;
            background-color: #000000;
        }
        .status-header {
            font-family: 'Audiowide', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: 'Audiowide', sans-serif;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.2s ease;
}

.btn:hover {
    background-color: #ffffff;
    color: #000000;
}
    </style>
</head>
<body>

    <div class="container">
        <h1>SEND A MESSAGE</h1>
        <nav>
            <a href="index.html" class="btn">RETURN HOME</a>

        </nav>

        <form id="contact-form">
            <div class="form-group">
                <label for="name">NAME</label>
                <input type="text" id="name" name="name" placeholder="e.g. Vedant Trivedi" required>
            </div>
            
            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" placeholder="name@domain.com" required>
            </div>

            <div class="form-group">
                <label for="message">MESSAGE</label>
                <textarea id="message" name="message" rows="5" placeholder="Enter details..." required></textarea>
            </div>

            <button type="submit" id="submit-btn">SEND</button>
        </form>

        <div id="status-box"></div>
    </div>

    <script>
        const form = document.getElementById('contact-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusBox = document.getElementById('status-box');

        // Target endpoint (Formspree or FormSubmit AJAX)
        const ENDPOINT = "https://formsubmit.co/ajax/vedutrivedi49@gmail.com";

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // UI Loading State
            submitBtn.disabled = true;
            submitBtn.innerText = "SENDING...";
            statusBox.style.display = "none";

            const formData = new FormData(form);

            try {
                const response = await fetch(ENDPOINT, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    form.style.display = "none";
                    statusBox.style.display = "block";
                    statusBox.innerHTML = `
                        <div class="status-header">MESSAGE SEND!</div>
                        <p>Message was successful! Estimated response time.... 3 Hours</p>
                        <p><a href="index.html">Return Home</a></p>
                    `;
                } else {
                    throw new Error('Server returned non-200 status');
                }
            } catch (error) {
                statusBox.style.display = "block";
                statusBox.innerHTML = `
                    <div class="status-header">Error</div>
                    <p>Failed to send Message. Please check connection or email directly at vedutrivedi49@gmail.com</p>
                `;
                submitBtn.disabled = false;
                submitBtn.innerText = "ERROR! RETRY";
            }
        });
    </script>
</body>
</html>
